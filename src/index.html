<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HK Bus Radar & BBI Command Center</title>

  <meta name="description" content="High-precision dead-reckoning bus radar, ghost bus irregularity detector, and BBI transfer matrix for Hong Kong." />
  <meta name="theme-color" content="#020617" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect to Carto CDN for fast dark tile loading -->
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://basemaps.cartocdn.com" />

  <!-- Leaflet Core CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Styling -->
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/leaflet-dark.css" />
</head>
<body class="h-full w-full overflow-hidden flex flex-col font-sans select-none antialiased">

  <!-- Top Navigation & Live Telemetry Bar -->
  <header id="nav-container" class="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between px-4 z-20 shrink-0"></header>

  <!-- Main Viewport Layout: Split Map + Side Dashboard -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- Dead-Reckoning Map Display -->
    <section class="flex-1 relative h-[50vh] lg:h-full bg-slate-950" aria-label="Bus Radar Map">
      <div id="radar-map" class="absolute inset-0 z-0"></div>

      <!-- In-Map Floating Radar Controls -->
      <div id="map-controls" class="absolute top-4 left-4 z-10 flex flex-col gap-2"></div>

      <!-- Live Map Attribution / Telemetry Badge -->
      <div class="absolute bottom-2 left-2 z-10 pointer-events-none bg-slate-950/80 px-2 py-1 rounded text-[11px] text-slate-400 font-mono border border-slate-800">
        Radar Mode: Dead-Reckoning Active • 30s Polling
      </div>
    </section>

    <!-- Side Analysis & BBI Hub Inspector -->
    <aside class="w-full lg:w-[480px] xl:w-[540px] h-[50vh] lg:h-full bg-slate-900 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col z-10 overflow-hidden shrink-0">

      <!-- Tab Navigation Switcher -->
      <div class="flex border-b border-slate-800 bg-slate-950/60 shrink-0" role="tablist">
        <button id="tab-btn-radar" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-amber-400 border-b-2 border-amber-400 flex items-center justify-center gap-1.5" role="tab" aria-selected="true">
          <span>📡</span> Live Radar
        </button>
        <button id="tab-btn-bbi" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center justify-center gap-1.5" role="tab" aria-selected="false">
          <span>⚡</span> BBI Matrix
        </button>
        <button id="tab-btn-tunnel" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center justify-center gap-1.5" role="tab" aria-selected="false">
          <span>🛣️</span> Tunnel vs MTR
        </button>
        <button id="tab-btn-ghost" class="flex-1 py-3 text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center justify-center gap-1.5" role="tab" aria-selected="false">
          <span>🚨</span> Ghost Alert
        </button>
      </div>

      <!-- Tab Content Panels Container -->
      <div id="panel-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    </aside>
  </main>

  <!-- Client Script Bootstrap -->
  <script type="module" src="/main.js"></script>
</body>
</html>
