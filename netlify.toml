[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "development"
  NPM_FLAGS = "--include=dev"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy rules for API endpoints
[[redirects]]
  from = "/api/kmb/*"
  to = "/.netlify/functions/kmb-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/ctb/*"
  to = "/.netlify/functions/ctb-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/api/td/*"
  to = "/.netlify/functions/td-traffic"
  status = 200
  force = true

# SPA client-side router fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
