# ==========================================
# 1. BUILD SETTINGS
# ==========================================
[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# ==========================================
# 2. LOCAL DEVELOPMENT OVERRIDES
# ==========================================
[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  publish = "dist"
  autoLaunch = false

# ==========================================
# 3. PRODUCTION & BRANCH BUILD CONTEXTS
# ==========================================
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_BASE = "/.netlify/functions"

[context.deploy-preview.environment]
  NODE_ENV = "staging"
  VITE_API_BASE = "/.netlify/functions"

# ==========================================
# 4. REDIRECTS & API PROXY REWRITES
# ==========================================

[[redirects]]
  from = "/api/kmb/*"
  to = "/.netlify/functions/kmb-proxy/:splat"
  status = 200

[[redirects]]
  from = "/api/ctb/*"
  to = "/.netlify/functions/ctb-proxy/:splat"
  status = 200

[[redirects]]
  from = "/api/td/*"
  to = "/.netlify/functions/td-traffic/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==========================================
# 5. SECURITY & PERFORMANCE HEADERS
# ==========================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
